<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="base:app_id" content="6a12597d355ac57b9a9b649a" />
    <title>BaseCall | Call the market. Win on Base.</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b1120;
            --surface-color: #151e32;
            --surface-hover: #1e293b;
            --primary: #0052ff;
            --primary-hover: #0043d1;
            --accent-cyan: #00e5ff;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --yes-color: #10b981;
            --no-color: #ef4444;
            --border-color: rgba(255, 255, 255, 0.05);
            --glow: 0 0 20px rgba(0, 229, 255, 0.15);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: radial-gradient(circle at top center, rgba(0, 82, 255, 0.15), transparent 60%);
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 5%;
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 300;
        }

        .wallet-btn {
            background: linear-gradient(135deg, var(--primary), var(--accent-cyan));
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--glow);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .wallet-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.3);
        }

        .wallet-info {
            display: none;
            align-items: center;
            gap: 1rem;
            background: var(--surface-color);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
        }

        .eth-balance {
            font-weight: 600;
            color: var(--accent-cyan);
        }

        .wallet-address {
            background: var(--surface-hover);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
            flex: 1;
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media(min-width: 900px) {
            .container {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media(max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            .logo-container {
                align-items: center;
                text-align: center;
            }
            .wallet-info {
                flex-direction: column;
                gap: 0.5rem;
                text-align: center;
            }
            .eth-price {
                font-size: 2.5rem;
            }
            .market-title {
                font-size: 1.4rem;
            }
            .container {
                padding: 1.5rem 1rem;
                gap: 1rem;
            }
            .card {
                padding: 1.5rem;
            }
            .market-stats {
                gap: 0.5rem;
            }
            .bet-row {
                flex-direction: column;
                text-align: center;
                gap: 1rem;
            }
            .bet-row > div > div {
                text-align: center !important;
            }
        }

        /* Cards */
        .card {
            background: var(--surface-color);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, border-color 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent-cyan));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: rgba(0, 229, 255, 0.3);
        }

        .card:hover::before {
            opacity: 1;
        }

        /* Price Section */
        .price-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .price-title {
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .eth-price {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .price-change {
            font-size: 1.2rem;
            font-weight: 600;
            padding: 0.25rem 1rem;
            border-radius: 9999px;
            display: inline-block;
        }

        .price-change.up { color: var(--yes-color); background: rgba(16, 185, 129, 0.1); }
        .price-change.down { color: var(--no-color); background: rgba(239, 68, 68, 0.1); }

        /* Market Section */
        .market-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .market-title {
            font-size: 1.8rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .timer-badge {
            background: rgba(0, 82, 255, 0.2);
            color: var(--accent-cyan);
            padding: 0.5rem 1.25rem;
            border-radius: 9999px;
            font-weight: 600;
            font-size: 1.1rem;
            display: inline-block;
            border: 1px solid rgba(0, 229, 255, 0.2);
        }

        .market-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            background: var(--surface-hover);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: 600;
        }

        /* Betting Area */
        .bet-input-group {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .eth-input {
            flex: 1;
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            color: white;
            padding: 1rem;
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .eth-input:focus {
            border-color: var(--accent-cyan);
        }

        .bet-buttons {
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-yes {
            background: var(--yes-color);
            color: white;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.2);
        }
        .btn-yes:hover { background: #0ea5e9; transform: translateY(-2px); box-shadow: 0 0 25px rgba(16, 185, 129, 0.4); }

        .btn-no {
            background: var(--no-color);
            color: white;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }
        .btn-no:hover { background: #dc2626; transform: translateY(-2px); box-shadow: 0 0 25px rgba(239, 68, 68, 0.4); }

        /* User Bets & Results */
        .my-bets {
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .bet-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            background: rgba(255,255,255,0.02);
            padding: 1rem;
            border-radius: 10px;
        }

        .claim-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: none;
        }

        .claim-btn:hover { background: var(--primary-hover); }

        .notification {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--surface-color);
            border-left: 4px solid var(--accent-cyan);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transform: translateX(150%);
            transition: transform 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
        }

        .notification.show { transform: translateX(0); }

        /* Loaders */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid var(--accent-cyan);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 0 auto;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <nav>
        <div class="logo-container">
            <div class="logo">BaseCall</div>
            <div class="tagline">Call the market. Win on Base.</div>
        </div>
        <div>
            <button id="connectWalletBtn" class="wallet-btn">Connect Wallet</button>
            <div id="walletInfo" class="wallet-info">
                <span id="ethBalance" class="eth-balance">0.00 ETH</span>
                <span id="walletAddress" class="wallet-address">0x...</span>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Live Price Card -->
        <div class="card price-section">
            <div class="price-title">Live Ethereum Price</div>
            <div id="ethPrice" class="eth-price">$---.--</div>
            <div id="priceChange" class="price-change">0.00%</div>
            <p style="color: var(--text-muted); font-size: 0.8rem; margin-top: 1rem;">Updated every 30 seconds via CoinGecko</p>
        </div>

        <!-- Active Market Card -->
        <div class="card">
            <div class="market-header">
                <h2 class="market-title">Will ETH be higher in 1 hour?</h2>
                <div id="countdownTimer" class="timer-badge">60:00</div>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">Starting Price: <span id="startPrice">$---.--</span></p>
            </div>

            <div class="market-stats">
                <div class="stat-box">
                    <div class="stat-label">YES Pool (ETH)</div>
                    <div id="yesPool" class="stat-value" style="color: var(--yes-color);">0.00</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">NO Pool (ETH)</div>
                    <div id="noPool" class="stat-value" style="color: var(--no-color);">0.00</div>
                </div>
            </div>

            <div class="bet-input-group">
                <input type="number" id="betAmount" class="eth-input" placeholder="Amount in ETH" min="0.01" step="0.01">
            </div>

            <div class="bet-buttons">
                <button class="btn btn-yes" onclick="placeBet(true)">YES</button>
                <button class="btn btn-no" onclick="placeBet(false)">NO</button>
            </div>

            <div class="my-bets">
                <h3 style="font-size: 1.1rem; margin-bottom: 0.5rem;">Your Activity</h3>
                <div class="bet-row">
                    <div>
                        <div style="color: var(--text-muted); font-size: 0.9rem;">Current Position</div>
                        <div id="userPosition" style="font-weight: 600;">None</div>
                    </div>
                    <div>
                        <div style="color: var(--text-muted); font-size: 0.9rem; text-align: right;">Potential Winnings</div>
                        <div id="potentialWinnings" style="font-weight: 600; color: var(--accent-cyan); text-align: right;">0.00 ETH</div>
                    </div>
                </div>
                <div style="margin-top: 1rem; text-align: center;">
                    <button id="claimBtn" class="claim-btn" onclick="claimWinnings()">Claim Winnings</button>
                </div>
            </div>
        </div>
    </div>

    <div id="notification" class="notification"></div>

    <!-- Web3 Integration Script -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <script>
        // App State
        let currentEthPrice = 0;
        let startPrice = 3500.00; // Mock start price
        let timeLeft = 3600; // 1 hour in seconds
        let yesPoolEth = 0;
        let noPoolEth = 0;
        
        let userWallet = null;
        let userBetSide = null; // true = YES, false = NO
        let userBetAmount = 0;
        let provider = null;
        let signer = null;

        // Constants
        const BASE_CHAIN_ID = '0x2105'; // 8453 in hex
        const BUILDER_DATA = '0x42617365'; // Base builder attribution
        
        // Mock Contract Address
        const CONTRACT_ADDRESS = "0x0000000000000000000000000000000000000000"; 

        // --- UI & API Logic ---

        async function fetchEthPrice() {
            try {
                const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=usd&include_24hr_change=true');
                const data = await response.json();
                
                currentEthPrice = data.ethereum.usd;
                const change = data.ethereum.usd_24h_change;

                document.getElementById('ethPrice').innerText = `$${currentEthPrice.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                
                const changeEl = document.getElementById('priceChange');
                changeEl.innerText = `${change > 0 ? '+' : ''}${change.toFixed(2)}%`;
                changeEl.className = `price-change ${change >= 0 ? 'up' : 'down'}`;

                if(document.getElementById('startPrice').innerText === '$---.--') {
                    startPrice = currentEthPrice;
                    document.getElementById('startPrice').innerText = `$${startPrice.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                }

            } catch (error) {
                console.error("Error fetching price:", error);
            }
        }

        function updateTimer() {
            if (timeLeft <= 0) {
                document.getElementById('countdownTimer').innerText = "MARKET CLOSED";
                document.getElementById('countdownTimer').style.background = 'rgba(239, 68, 68, 0.2)';
                document.getElementById('countdownTimer').style.color = 'var(--no-color)';
                document.getElementById('countdownTimer').style.borderColor = 'rgba(239, 68, 68, 0.4)';
                resolveMarketMock();
                return;
            }

            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            document.getElementById('countdownTimer').innerText = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            timeLeft--;
        }

        function showNotification(msg) {
            const el = document.getElementById('notification');
            el.innerText = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3000);
        }

        // --- Web3 Logic ---

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userWallet = accounts[0];

                    // Switch to Base Network
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: BASE_CHAIN_ID }],
                        });
                    } catch (switchError) {
                        // This error code indicates that the chain has not been added to the wallet.
                        if (switchError.code === 4902) {
                            showNotification("Please add Base network to your wallet.");
                        }
                    }

                    const balanceWei = await provider.getBalance(userWallet);
                    const balanceEth = ethers.formatEther(balanceWei);

                    // Update UI
                    document.getElementById('connectWalletBtn').style.display = 'none';
                    document.getElementById('walletInfo').style.display = 'flex';
                    document.getElementById('walletAddress').innerText = `${userWallet.substring(0,6)}...${userWallet.substring(38)}`;
                    document.getElementById('ethBalance').innerText = `${parseFloat(balanceEth).toFixed(4)} ETH`;
                    
                    showNotification("Wallet Connected!");

                } catch (error) {
                    console.error("Connection error:", error);
                    showNotification("Connection failed. See console.");
                }
            } else {
                showNotification("Please open this app in Base App to connect your wallet");
            }
        }

        async function placeBet(isYes) {
            if(!userWallet) {
                showNotification("Connect wallet first!");
                return;
            }

            if(timeLeft <= 0) {
                showNotification("Market is closed!");
                return;
            }

            const amountStr = document.getElementById('betAmount').value;
            if(!amountStr || parseFloat(amountStr) <= 0) {
                showNotification("Enter a valid amount!");
                return;
            }

            const amountEth = parseFloat(amountStr);

            try {
                // In a real app, this would be a contract call:
                // const tx = await contract.placeBet(isYes, { value: ethers.parseEther(amountStr) });
                // We mock the transaction submission including the Base builder attribution data
                
                showNotification("Prompting wallet...");
                
                // MOCK TX FOR DEMONSTRATION 
                const txParams = {
                    to: CONTRACT_ADDRESS,
                    value: ethers.parseEther(amountStr),
                    data: BUILDER_DATA // Base builder attribution suffix
                };
                
                // Since contract doesn't exist, we won't actually send to avoid failing tx.
                // We simulate success.
                setTimeout(() => {
                    // Update State
                    if(isYes) {
                        yesPoolEth += amountEth;
                        document.getElementById('yesPool').innerText = yesPoolEth.toFixed(2);
                    } else {
                        noPoolEth += amountEth;
                        document.getElementById('noPool').innerText = noPoolEth.toFixed(2);
                    }

                    userBetSide = isYes;
                    userBetAmount += amountEth;

                    // Update UI
                    document.getElementById('userPosition').innerText = `${userBetAmount.toFixed(2)} ETH on ${isYes ? 'YES' : 'NO'}`;
                    document.getElementById('userPosition').style.color = isYes ? 'var(--yes-color)' : 'var(--no-color)';
                    
                    calculateWinnings();
                    showNotification(`Successfully bet ${amountEth} ETH on ${isYes ? 'YES' : 'NO'}`);
                    document.getElementById('betAmount').value = '';

                }, 1000);

            } catch (error) {
                console.error(error);
                showNotification("Transaction failed.");
            }
        }

        function calculateWinnings() {
            if(userBetAmount === 0) return;
            
            let totalPool = yesPoolEth + noPoolEth;
            let winningPool = userBetSide ? yesPoolEth : noPoolEth;
            
            if(winningPool === 0) return;

            let share = userBetAmount / winningPool;
            let expectedPayout = (totalPool * share) * 0.98; // minus 2% fee

            document.getElementById('potentialWinnings').innerText = `${expectedPayout.toFixed(4)} ETH`;
        }

        function resolveMarketMock() {
            if(userBetAmount > 0) {
                const won = (currentEthPrice > startPrice && userBetSide) || (currentEthPrice <= startPrice && !userBetSide);
                
                if(won) {
                    document.getElementById('claimBtn').style.display = 'inline-block';
                    showNotification("You won! You can claim your winnings.");
                } else {
                    document.getElementById('potentialWinnings').innerText = "0.00 ETH";
                    document.getElementById('userPosition').innerText += " (LOST)";
                }
            }
        }

        function claimWinnings() {
            if(!userWallet) return;
            
            showNotification("Prompting wallet for claim...");
            
            // Mock transaction
            setTimeout(() => {
                showNotification("Winnings claimed successfully!");
                document.getElementById('claimBtn').style.display = 'none';
                document.getElementById('potentialWinnings').innerText = "0.00 ETH";
            }, 1000);
        }

        // Init
        document.getElementById('connectWalletBtn').addEventListener('click', connectWallet);
        fetchEthPrice();
        setInterval(fetchEthPrice, 30000); // 30 seconds
        setInterval(updateTimer, 1000);

    </script>
</body>

SOLIDITY SMART CONTRACT: BaseCallMarket.sol

// SPDX-License-Identifier: MIT
pragma solidity ^0.8.20;

interface AggregatorV3Interface {
  function latestRoundData()
    external
    view
    returns (
      uint80 roundId,
      int256 answer,
      uint256 startedAt,
      uint256 updatedAt,
      uint80 answeredInRound
    );
}

contract BaseCallMarket {
    address public owner;
    AggregatorV3Interface internal priceFeed;
    
    // Base Mainnet Chainlink ETH/USD: 0x71041dddad3595F9CEd3DcCFBe3D1F4b0a16Bb70
    
    uint256 public startPrice;
    uint256 public resolutionPrice;
    uint256 public endTime;
    
    uint256 public yesPool;
    uint256 public noPool;
    
    enum MarketState { Open, Resolved, Refunded }
    MarketState public state;
    bool public ethHigherAtResolution;
    
    mapping(address => uint256) public yesBets;
    mapping(address => uint256) public noBets;
    mapping(address => bool) public hasClaimed;
    
    uint256 public constant FEE_PERCENTAGE = 2; // 2%
    uint256 public collectedFees;

    event BetPlaced(address indexed user, bool isYes, uint256 amount);
    event MarketResolved(uint256 finalPrice, bool ethHigher);
    event WinningsClaimed(address indexed user, uint256 amount);
    event MarketRefunded();

    constructor(address _priceFeedAddress, uint256 _durationSeconds) {
        owner = msg.sender;
        priceFeed = AggregatorV3Interface(_priceFeedAddress);
        endTime = block.timestamp + _durationSeconds;
        startPrice = getLatestPrice();
        state = MarketState.Open;
    }

    modifier onlyOwner() {
        require(msg.sender == owner, "Not owner");
        _;
    }

    modifier inState(MarketState _state) {
        require(state == _state, "Invalid market state");
        _;
    }

    function getLatestPrice() public view returns (uint256) {
        (
            , 
            int price,
            ,
            ,
            
        ) = priceFeed.latestRoundData();
        require(price > 0, "Invalid price");
        return uint256(price);
    }

    function placeBet(bool isYes) external payable inState(MarketState.Open) {
        require(block.timestamp < endTime, "Market closed");
        require(msg.value > 0, "Bet must be > 0");

        if (isYes) {
            yesBets[msg.sender] += msg.value;
            yesPool += msg.value;
        } else {
            noBets[msg.sender] += msg.value;
            noPool += msg.value;
        }

        emit BetPlaced(msg.sender, isYes, msg.value);
    }

    function resolveMarket() external onlyOwner inState(MarketState.Open) {
        require(block.timestamp >= endTime, "Market not ended");
        
        if (yesPool == 0 || noPool == 0) {
            state = MarketState.Refunded;
            emit MarketRefunded();
            return;
        }

        resolutionPrice = getLatestPrice();
        ethHigherAtResolution = resolutionPrice > startPrice;
        state = MarketState.Resolved;

        emit MarketResolved(resolutionPrice, ethHigherAtResolution);
    }

    function claimWinnings() external inState(MarketState.Resolved) {
        require(!hasClaimed[msg.sender], "Already claimed");
        
        uint256 userBet = ethHigherAtResolution ? yesBets[msg.sender] : noBets[msg.sender];
        require(userBet > 0, "No winning bet");

        uint256 winningPool = ethHigherAtResolution ? yesPool : noPool;
        uint256 losingPool = ethHigherAtResolution ? noPool : yesPool;

        // Calculate share
        uint256 grossWinnings = userBet + ((losingPool * userBet) / winningPool);
        
        // Deduct 2% fee from winning payouts
        uint256 fee = (grossWinnings * FEE_PERCENTAGE) / 100;
        uint256 netPayout = grossWinnings - fee;

        hasClaimed[msg.sender] = true;
        collectedFees += fee;

        (bool success, ) = payable(msg.sender).call{value: netPayout}("");
        require(success, "Transfer failed");

        emit WinningsClaimed(msg.sender, netPayout);
    }

    function refundAll() external {
        require(state == MarketState.Refunded, "Not in refund state");
        require(!hasClaimed[msg.sender], "Already claimed");

        uint256 refundAmount = yesBets[msg.sender] + noBets[msg.sender];
        require(refundAmount > 0, "No bets to refund");

        hasClaimed[msg.sender] = true;

        (bool success, ) = payable(msg.sender).call{value: refundAmount}("");
        require(success, "Transfer failed");
    }

    function withdrawFees() external onlyOwner {
        uint256 amount = collectedFees;
        collectedFees = 0;
        (bool success, ) = payable(owner).call{value: amount}("");
        require(success, "Transfer failed");
    }
}
